name: Alerta de ingresso

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Checar página
        env:
          URL: ${{ secrets.URL }}
          TOPICO: ${{ secrets.TOPICO }}
        run: python monitor.py

      - name: Salvar estado
        run: |
          git config user.name "alerta-bot"
          git config user.email "alerta-bot@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "atualiza estado" && git push)
